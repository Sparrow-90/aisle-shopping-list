<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopping list</title>
<meta name="theme-color" content="#2f7d4f">
<style>
  :root {
    --page: #bccaf3;
    --shell: #161616;
    --paper: #f6f5f8;
    --white: #ffffff;
    --yellow: #f7df98;
    --cyan: #b5e2ea;
    --peri: #b8c6f3;
    --ink: #161616;
    --muted: #8b8b92;
    --line: rgba(22, 22, 22, .09);
    --font: "Helvetica Neue", Helvetica, Arial, "Segoe UI", sans-serif;
    --dock-h: 140px;
    /* Motion */
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --press: 160ms;
  }
  @media (prefers-color-scheme: dark) {
    :root { --page: #0e0f13; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--page);
    color: var(--ink);
    font: 16px/1.35 var(--font);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Shell: black device-like frame with stacked cards */
  .shell {
    max-width: 480px; margin: 28px auto 0; padding: 6px; min-height: calc(100vh - 28px);
    background: var(--shell); border-radius: 46px 46px 0 0;
    padding-bottom: calc(var(--dock-h) + 30px);
    box-shadow: 0 30px 80px rgba(30, 40, 90, .25);
  }
  .card { border-radius: 30px; margin-bottom: 6px; }
  .label { margin: 0; font-size: 13px; color: var(--ink); opacity: .8; }

  /* Round buttons */
  .circle {
    width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
    border: 0; flex: none;
  }
  .circle.light { background: var(--white); color: var(--ink); }

  /* Press feedback */
  #addBtn, .chip, .linkbtn, #clearDone, .menu-pop button, .menu summary, #toast button, .del, .catpick, .pill {
    transition: transform var(--press) var(--ease-out), background-color 150ms ease, color 150ms ease,
                border-color 150ms ease, opacity 150ms ease;
  }
  #addBtn:active, .chip:active, #clearDone:active, .menu-pop button:active, #toast button:active, .linkbtn:active { transform: scale(0.97); }
  .del:active, .catpick:active, .menu summary:active, #addBtn:active { transform: scale(0.92); }

  /* Top (black) area */
  .top { display: flex; align-items: center; gap: 12px; padding: 24px 18px 20px 22px; color: #fff; }
  .hello { flex: 1; min-width: 0; }
  .hello h1 { margin: 0; font-size: 21px; font-weight: 400; letter-spacing: -.01em; }
  .wave { display: inline-block; transform-origin: 70% 80%; animation: wave 1.1s 300ms var(--ease-in-out) 1; }
  #progress { margin: 2px 0 0; font-size: 17px; color: rgba(255,255,255,.62); font-variant-numeric: tabular-nums; }
  #progress.bump { animation: bump 260ms var(--ease-out); }
  .menu { position: relative; }
  .menu summary { list-style: none; cursor: pointer; }
  .menu summary::-webkit-details-marker { display: none; }
  .menu-pop {
    position: absolute; right: 0; top: 60px; z-index: 30;
    background: var(--white); border-radius: 22px; color: var(--ink);
    box-shadow: 0 18px 50px rgba(0,0,0,.28); padding: 8px; min-width: 230px;
    transform-origin: top right;
  }
  .menu[open] .menu-pop { transition: opacity 160ms var(--ease-out), transform 160ms var(--ease-out); }
  @starting-style {
    .menu[open] .menu-pop { opacity: 0; transform: scale(0.95) translateY(-4px); }
  }
  .menu-pop button {
    display: block; width: 100%; text-align: left; background: none; border: 0;
    padding: 12px 14px; border-radius: 14px; font-size: 15px;
  }
  .menu-pop .danger { color: #c4402c; }

  /* Hero */
  .hero { background: var(--paper); padding: 26px 22px 20px; }
  .headline {
    margin: 10px 0 0; font-size: 35px; line-height: 1.1; font-weight: 400; letter-spacing: -.03em;
  }
  .headline b { font-weight: 700; }
  .headline.swap { animation: swap 240ms var(--ease-out); }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .pills:empty { display: none; }
  .pill {
    display: inline-flex; align-items: center; gap: 7px; background: var(--white);
    border-radius: 999px; padding: 10px 15px; font-size: 14px; font-weight: 500;
  }
  .pill .dim { color: var(--muted); }

  /* Progress card */
  .progress-card { background: var(--yellow); padding: 16px 22px 20px; }
  .pc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .pc-top .circle { width: 34px; height: 34px; }
  .pc-top .circle svg.i { width: 16px; height: 16px; }
  .pc-main { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  #mood { margin: 4px 0 0; font-size: 27px; line-height: 1.15; letter-spacing: -.02em; max-width: 60%; }
  .pct {
    margin: 0; font-size: 78px; line-height: .85; font-weight: 300; letter-spacing: -.05em;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .pct small { font-size: .62em; letter-spacing: -.02em; margin-left: 2px; }
  .bar { height: 4px; border-radius: 4px; background: rgba(22,22,22,.1); overflow: hidden; margin-top: 18px; }
  .bar i {
    display: block; height: 100%; background: var(--ink); border-radius: inherit;
    transform-origin: left; transform: scaleX(0); transition: transform 320ms var(--ease-out);
  }

  /* Groups */
  .group { background: var(--white); border-radius: 30px; margin-bottom: 6px; overflow: hidden; }
  .group h2 {
    margin: 0; padding: 16px 16px 6px 16px; display: flex; gap: 12px; align-items: center;
    font-size: 20px; font-weight: 600; letter-spacing: -.015em;
  }
  .gicon {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
    background: var(--tint, var(--paper)); font-size: 20px; flex: none;
  }
  .group h2 .n {
    margin-left: auto; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
    border: 1px solid var(--line); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums;
  }
  .group h2 .n.bump { animation: bump 260ms var(--ease-out); }
  .group.complete h2 .gname { color: var(--muted); }
  .group.complete h2 .n { background: var(--ink); color: #fff; border-color: var(--ink); }
  .group.just-complete h2 .n { animation: pop 320ms var(--ease-out); }
  .group ul { list-style: none; margin: 0; padding: 2px 0 8px; }
  .item {
    display: flex; align-items: center; gap: 6px; padding: 0 12px 0 4px; position: relative;
    background: var(--white); scroll-margin-bottom: calc(var(--dock-h) + 20px);
  }
  .item + .item::before {
    content: ""; position: absolute; top: 0; left: 62px; right: 16px; height: 1px; background: var(--line);
  }
  .item.flash { animation: flash 900ms var(--ease-out); }
  .tick {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px;
    background: none; border: 0; text-align: left; padding: 12px 6px 12px 12px; min-height: 60px;
  }
  .box {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    border: 1.5px solid rgba(22,22,22,.22); display: grid; place-items: center;
    transition: transform var(--press) var(--ease-out), background-color 150ms ease, border-color 150ms ease;
  }
  .tick:active .box { transform: scale(0.85); }
  .box svg {
    width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 3;
    stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1;
  }
  .txt { display: flex; flex-direction: column; min-width: 0; }
  .name { position: relative; align-self: flex-start; font-size: 17px; font-weight: 500; letter-spacing: -.01em; overflow-wrap: anywhere; }
  .name::after {
    content: ""; position: absolute; left: -2px; right: -2px; top: 54%; height: 1.5px;
    background: currentColor; transform: scaleX(0); transform-origin: left; border-radius: 1px;
  }
  .qty { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .done .box { background: var(--ink); border-color: var(--ink); }
  .done .box svg { stroke-dashoffset: 0; }
  .done .name { color: var(--muted); }
  .done .name::after { transform: scaleX(1); }
  .done .qty { opacity: .6; }

  .just-ticked .box { animation: pop 300ms var(--ease-out); }
  .just-ticked .box svg { animation: draw 240ms 70ms var(--ease-out) backwards; }
  .just-ticked .name::after { animation: strike 260ms 110ms var(--ease-out) backwards; }
  .just-ticked .name { animation: dim 300ms 110ms ease backwards; }
  .just-unticked .box { animation: settle 220ms var(--ease-out); }

  .catpick, .del {
    position: relative; flex: none; width: 42px; height: 42px; border-radius: 50%;
    display: grid; place-items: center; border: 1px solid var(--line); background: transparent;
  }
  .catpick { font-size: 17px; }
  .catpick select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; border-radius: 50%; }
  .catpick:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
  .del { color: var(--ink); font-size: 20px; line-height: 1; }
  .del svg.i { width: 16px; height: 16px; }

  .empty { background: var(--paper); border-radius: 30px; padding: 34px 22px 30px; }
  .empty b { display: block; font-size: 34px; margin-bottom: 12px; }
  .empty p { margin: 0; font-size: 22px; line-height: 1.2; letter-spacing: -.02em; }
  .empty p span { color: var(--muted); }

  #clearDone {
    display: block; margin: 16px auto 4px; padding: 15px 24px; border-radius: 999px;
    border: 0; background: var(--white); color: var(--ink); font-weight: 600; font-size: 15px;
  }

  .banner { background: #fff3cd; color: #6b4e00; padding: 14px 18px; font-size: 14px; }

  /* Dock: the black bar at the bottom with the input and suggestions */
  .dock {
    position: fixed; z-index: 25; left: 50%; bottom: 0; transform: translateX(-50%);
    width: min(480px, 100%); background: var(--shell); color: #fff;
    border-radius: 32px 32px 0 0; padding: 12px 12px calc(14px + env(safe-area-inset-bottom));
    box-shadow: 0 -12px 30px rgba(0,0,0,.18);
  }
  .sugg-head { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 10px 8px; }
  .sugg-head span { font-size: 12px; color: rgba(255,255,255,.55); text-transform: uppercase; letter-spacing: .08em; }
  .linkbtn { background: none; border: 0; color: var(--peri); font-size: 13px; padding: 3px 8px; border-radius: 999px; }
  #chips {
    display: flex; gap: 6px; overflow-x: auto; padding: 0 2px 10px; scrollbar-width: none;
    -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent);
  }
  #chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    border: 1px solid transparent; background: #2a2a2a; color: #fff;
    padding: 10px 15px; border-radius: 999px; font-size: 14px;
  }
  .chip .x { color: #ff8f7a; font-weight: 700; display: none; }
  .editing .chip { border: 1px dashed #5a5a5a; }
  .editing .chip .x { display: inline; }
  .addrow { display: flex; gap: 8px; }
  #entry {
    flex: 1; min-width: 0; padding: 16px 20px; border-radius: 999px; font-size: 16px;
    border: 1px solid transparent; background: #262626; color: #fff; outline: none;
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  #entry::placeholder { color: #8a8a8a; }
  #entry:focus { border-color: var(--peri); box-shadow: 0 0 0 4px rgba(184,198,243,.18); }
  #addBtn {
    width: 54px; height: 54px; border-radius: 50%; border: 0; flex: none;
    background: var(--white); color: var(--ink); display: grid; place-items: center;
  }
  #addBtn svg.i { width: 22px; height: 22px; stroke-width: 2; }
  #addBtn.idle { opacity: .45; }

  /* Entrances */
  .enter { animation: enter 260ms var(--ease-out) backwards; animation-delay: var(--d, 0ms); }

  /* Toast: white pill floating above the dock */
  #toast {
    position: fixed; left: 50%; bottom: calc(var(--dock-h) + 26px); transform: translate(-50%, 16px) scale(.97);
    background: var(--white); color: var(--ink); padding: 8px 8px 8px 20px; border-radius: 999px;
    display: flex; align-items: center; gap: 12px; z-index: 40; opacity: 0; visibility: hidden;
    max-width: calc(100% - 32px); box-shadow: 0 14px 40px rgba(0,0,0,.25); font-size: 15px;
    transition: transform 180ms var(--ease-out), opacity 180ms ease, visibility 0s linear 180ms;
  }
  #toast.show {
    transform: translate(-50%, 0); opacity: 1; visibility: visible;
    transition: transform 280ms var(--ease-out), opacity 200ms ease, visibility 0s;
  }
  #toast button { background: var(--ink); border: 0; color: #fff; font-weight: 600; padding: 10px 16px; border-radius: 999px; }

  .confetti {
    position: fixed; z-index: 50; width: 7px; height: 11px; border-radius: 2px;
    margin: -5px 0 0 -3px; pointer-events: none; will-change: transform, opacity;
  }

  @media (hover: hover) and (pointer: fine) {
    .menu-pop button:hover { background: var(--paper); }
    .chip:hover { background: #333; }
    .tick:hover .box { border-color: var(--ink); }
    .catpick:hover, .del:hover { background: var(--paper); }
    .del:hover { color: #c4402c; }
    #clearDone:hover { background: var(--peri); }
    .linkbtn:hover { background: rgba(184,198,243,.12); }
    #toast button:hover { background: #333; }
  }

  /* Phones: the frame becomes the whole screen */
  @media (max-width: 520px) {
    body { background: var(--shell); }
    .shell { margin: 0; border-radius: 0; box-shadow: none; min-height: 100vh; }
    .headline { font-size: 32px; }
    .pct { font-size: 68px; }
  }

  @keyframes enter  { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
  @keyframes pop    { 0% { transform: scale(0.8); } 55% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes settle { from { transform: scale(0.85); } }
  @keyframes draw   { from { stroke-dashoffset: 1; } }
  @keyframes strike { from { transform: scaleX(0); } }
  @keyframes dim    { from { color: var(--ink); } }
  @keyframes bump   { from { transform: translateY(-4px); opacity: .3; } }
  @keyframes swap   { from { opacity: .35; filter: blur(2px); } }
  @keyframes flash  { from { background-color: #e3e9fb; } }
  @keyframes fade   { from { opacity: 0; } }
  @keyframes wave   { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(16deg); } 40% { transform: rotate(-8deg); } 60% { transform: rotate(12deg); } 80% { transform: rotate(-4deg); } }

  @media (prefers-reduced-motion: reduce) {
    .enter { animation-name: fade; }
    .wave, .just-ticked .box, .just-unticked .box, .group.just-complete h2 .n, .bump, #progress.bump, .headline.swap { animation: none; }
    .just-ticked .name::after { animation-name: fade; }
    #addBtn:active, .chip:active, #clearDone:active, .menu-pop button:active, #toast button:active,
    .linkbtn:active, .del:active, .catpick:active, .menu summary:active, .tick:active .box { transform: none; }
    #toast, #toast.show { transform: translate(-50%, 0); }
    @starting-style { .menu[open] .menu-pop { transform: none; } }
    .bar i { transition-duration: 0ms; }
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="hello">
      <h1>Shopping list <span class="wave" aria-hidden="true">👋</span></h1>
      <p id="progress">Welcome back</p>
    </div>
    <details class="menu" id="menu">
      <summary class="circle light" aria-label="More options" title="More options">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 4 3 8.5l9 4.5 9-4.5L12 4z"/><path d="m3 12.5 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg>
      </summary>
      <div class="menu-pop">
        <button id="mClearDone">Remove ticked items</button>
        <button id="mUntick">Untick everything</button>
        <button id="mClearAll" class="danger">Clear whole list</button>
        <button id="mForget" class="danger">Forget all suggestions</button>
      </div>
    </details>
  </header>

  <section class="card hero">
    <p class="label" id="today"></p>
    <h2 class="headline" id="headline"></h2>
    <div class="pills" id="pills"></div>
  </section>

  <section class="card progress-card" id="progressCard" hidden>
    <div class="pc-top">
      <span class="circle light" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></span>
      <span class="label">Your progress</span>
    </div>
    <div class="pc-main">
      <p id="mood"></p>
      <p class="pct"><span id="pct">0</span><small>%</small></p>
    </div>
    <div class="bar" aria-hidden="true"><i id="barFill"></i></div>
  </section>

  <div id="storageWarn" class="card banner" hidden>This browser is blocking local storage, so your list won't be saved after you close the page.</div>
  <main id="list"></main>
  <button id="clearDone" hidden></button>
</div>

<div class="dock" id="dock">
  <div id="suggBox" hidden>
    <div class="sugg-head">
      <span id="suggTitle">Often bought</span>
      <button class="linkbtn" id="suggEdit" type="button">Edit</button>
    </div>
    <div id="chips"></div>
  </div>
  <form class="addrow" id="addForm" autocomplete="off">
    <input id="entry" type="text" placeholder="Add products, e.g. 2 milk, bread" aria-label="Add products" enterkeyhint="done">
    <button id="addBtn" type="submit" class="idle" aria-label="Add" title="Add">
      <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </form>
</div>

<div id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" type="button">Undo</button></div>

<script>
(() => {
  'use strict';

  const STORE_KEY = 'dp-aisle-sorted-shopping-list.v1';

  // Groups, in the order you typically walk through a shop.
  // Keywords are lowercase without diacritics (English + Polish).
  // Plain keyword = prefix of a word; "=word" = exact word; "two words" = phrase.
  const CATS = [
    { id: 'produce', name: 'Fruit & vegetables', icon: '🥕', kw: [

      'truskaw','borowk','malin','arbuz','ananas','awokado','pomidor','ziemniak','kartofl','cebul','czosn','marchew','marchw','ogor',

    ]},
    { id: 'bakery', name: 'Bread & bakery', icon: '🥖', kw: [
      'bread','loaf','baguette','=roll','=rolls','bun','bagel','croissant','pita','tortilla','=wrap','=wraps','muffin','cake','donut',
      'doughnut','pastry','pastries','brioche','sourdough','=rye','ciabatta','chleb','bulk','bagiet','rogal','rogalik','drozdzowk',

      'cod','meat','chorizo','pepperoni','duck','fillet','hot dog',
      'mies','kurczak','kurcz','wolow','wieprz','szynk','boczek','boczku','kielbas','parow','mielon','indyk','ryb','losos','tunczyk',
      'dorsz','krewetk','schab','filet','piers','udk','udziec','kabanos','pasztet','karkow','zeberk','=kaczka','sledz','makrel','pstrag'
    ]},
    { id: 'frozen', name: 'Frozen', icon: '🧊', kw: [
      'frozen','ice cream','=ice','ice cubes','pizza','frozen chips','fish fingers','mrozon','=lody','=lod','lodow','pierog','paluszki rybne'

      'rice','pasta','spaghetti','penne','noodle','flour','sugar','salt','black pepper','oil','olive oil','vinegar','cereal','oat',
      'muesli','granola','cornflakes','corn flakes','jam','honey','peanut butter','sauce','ketchup','mayo','mustard','spice','=tea',
      'teabag','tea bags','coffee','canned','tinned','bean','lentil','chickpea','soup','stock','yeast','baking','nutmeg','cinnamon',
      'paprika powder','oregano','curry','pesto','passata','tomato paste','chopped tomatoes','couscous','quinoa','=tuna can',
      '=ryz','ryzu','makaron','=maka','=maki','cukier','cukru','=sol','=soli','pieprz','olej','oliw','ocet','platk','owsian','musli',
      'dzem','miod','=sos','sosu','ketchup','majonez','musztard','przypraw','herbat','=kawa','=kawy','=kawe','fasol','soczewic',
      'ciecierzyc','=zupa','zupk','bulion','drozdz','konserw','kasz','puszk','maslo orzechowe','koncentrat','passat','cynamon','kakao'
    ]},
    { id: 'snacks', name: 'Snacks & sweets', icon: '🍫', kw: [
      'chocolate','chips','crisps','cookie','biscuit','candy','candies','sweets','=nuts','peanut','almond','cashew','walnut','popcorn',
      'cracker','pretzel','=gum','chewing gum','snack','nutella','marshmallow','jelly','gummy','wafer',
      'czekolad','chrupk','ciastk','cukierk','baton','orzech','orzesz','migdal','paluszk','slodycz','zelk','=guma','wafl','krakers','precl'

    { id: 'drinks', name: 'Drinks', icon: '🧃', kw: [
      'water','juice','soda','cola','lemonade','beer','wine','vodka','whisky','whiskey','gin','=rum','drink','sparkling','tonic','smoothie',
      'energy drink','=wod','woda','wody','wode','=sok','soki','soku','napoj','napoi','piwo','piwa','=wino','=wina','wodk','lemoniad','oranzad'
    ]},
    { id: 'household', name: 'Household', icon: '🧽', kw: [
      'toilet paper','toilet roll','kitchen roll','paper towel','paper','detergent','washing','dish soap','dishwasher','sponge','bin bag',
      'bin liner','trash bag','foil','cling film','cling wrap','battery','batteries','bulb','candle','cleaner','bleach','softener',
      'napkin','tissue','laundry','baking paper','zip bag','freezer bag','=matches','lighter',
      'papier','recznik papier','recznik','=plyn','plynu','proszek','kapsulk','gabk','=worki','workow','folia','folie','bateri','zarowk',
      'swiecz','serwetk','chusteczk','wybielacz','zmywark','do naczyn','do prania','zapalk','zapalniczk','odswiezacz','domestos','ludwik'
    ]},
    { id: 'care', name: 'Personal care', icon: '🧴', kw: [
      'shampoo','conditioner','soap','toothpaste','toothbrush','deodorant','shower gel','razor','lotion','hand cream','face cream',
      'sunscreen','cotton','diaper','nappy','nappies','tampon','=pads','floss','mouthwash','vitamin','plaster','painkiller','ibuprofen','paracetamol',
      'szampon','odzywk','mydl','pasta do zebow','szczoteczk','dezodorant','antyperspirant','=zel','zel pod prysznic','maszynk','krem',
      'pielusz','wacik','patyczk','podpask','=nic dentystyczna','plyn do plukania','witamin','plaster','tabletk','apap'
    ]},
    { id: 'other', name: 'Other', icon: '🛒', kw: [] }
  ];
  const CAT_BY_ID = Object.fromEntries(CATS.map(c => [c.id, c]));

  // ---------- helpers ----------
  const $ = sel => document.querySelector(sel);
  const norm = s => s.toLowerCase()
    .replace(/ł/g, 'l')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, ' ').trim();

  const keyOf = name => norm(name);
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  // "Form" words say what kind of product it is, so they beat ingredient words:
  // "orange juice" -> Drinks, "strawberry jam" -> Pantry, "chicken soup" -> Pantry.
  const FORM_WORDS = new Set([
    'juice','=sok','soki','soku','smoothie','lemonade','lemoniad','jam','dzem','soup','=zupa','zupk','sauce','=sos','sosu','passata','passat','stock','bulion',
    'chips','crisps','cookie','biscuit','ciastk','wafer','wafl','cake','ciast','muffin','yogurt','yoghurt','jogurt','kefir',
    'ice cream','=lody','lodow','frozen','mrozon','oil','olej','=tea','herbat','canned','tinned','konserw','puszk','bread','chleb'
  ]);

  // Pre-split keywords by type. Score = keyword length, +100 for form words.
  const MATCHERS = [];
  for (const c of CATS) for (const k of c.kw) {
    const bonus = FORM_WORDS.has(k) ? 100 : 0;
    if (k.startsWith('=')) MATCHERS.push({ cat: c.id, type: 'exact', k: k.slice(1), len: k.length - 1 + bonus });
    else if (k.includes(' ')) MATCHERS.push({ cat: c.id, type: 'phrase', k, len: k.length + bonus });
    else MATCHERS.push({ cat: c.id, type: 'prefix', k, len: k.length + bonus });
  }

  function guessCategory(name) {
    const key = keyOf(name);
    if (state.learned[key]) return state.learned[key];
    const words = key.split(' ').filter(w => w && !/^\d+$/.test(w));
    const padded = ' ' + key + ' ';
    let best = null, bestLen = 0;
    for (const m of MATCHERS) {
      if (m.len <= bestLen) continue;
      let hit = false;
      if (m.type === 'phrase') hit = padded.includes(' ' + m.k);
      else if (m.type === 'exact') hit = words.includes(m.k);
      else hit = words.some(w => w.startsWith(m.k));
      if (hit) { best = m.cat; bestLen = m.len; }
    }
    return best || 'other';
  }

  // "2 milk", "milk 2l", "3x eggs", "1,5 kg potatoes" -> {name, qty}
  const UNIT = '(?:x|kg|dag|dkg|g|l|ml|szt\\.?|pcs|pc|packs?|op\\.?|bottles?|cans?|bags?)';
  const LEAD = new RegExp('^((?:\\d+(?:[.,]\\d+)?\\s*' + UNIT + '?)|(?:x\\s*\\d+))\\s+(.+)$', 'i');
  const TRAIL = new RegExp('^(.+?)\\s+((?:x\\s*)?\\d+(?:[.,]\\d+)?\\s*' + UNIT + '?)$', 'i');
  function parseEntry(raw) {
    let s = raw.trim().replace(/\s+/g, ' ');
    let qty = '';
    let m = s.match(LEAD);
    if (m) { qty = m[1]; s = m[2]; }
    else if ((m = s.match(TRAIL))) { s = m[1]; qty = m[2]; }
    return { name: cap(s), qty: qty.replace(/\s+/g, ' ') };
  }

  // ---------- state ----------
  const empty = () => ({ v: 1, items: [], history: {}, learned: {} });
  let state = empty();
  let storageOk = true;

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        state = Object.assign(empty(), s);
      }
    } catch (e) { storageOk = false; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); storageOk = true; }
    catch (e) { storageOk = false; }
    $('#storageWarn').hidden = storageOk;
  }

  // ---------- actions ----------
  let flashId = null;

  function addRaw(text) {
    const parts = text.split(/\s*(?:[;\n]|,(?!\d))\s*/).map(p => p.trim()).filter(Boolean);
    for (const p of parts) addOne(parseEntry(p));
    commit();
  }

  function addOne({ name, qty }) {
    if (!name) return;
    const key = keyOf(name);
    if (!key) return;
    const existing = state.items.find(i => keyOf(i.name) === key);
    if (existing) {
      existing.done = false;
      if (qty) existing.qty = qty;
      flashId = existing.id;
    } else {
      const item = { id: uid(), name, qty, cat: guessCategory(name), done: false, added: Date.now() };
      state.items.push(item);
      enterIds.add(item.id);
      const h = state.history[key] || { label: name, count: 0, last: 0 };
      h.label = name; h.count += 1; h.last = Date.now();
      state.history[key] = h;
    }
  }

  function snapshot() { return JSON.stringify(state); }
  function restore(snap) {
    const had = new Set(state.items.map(i => i.id));
    state = JSON.parse(snap);
    state.items.forEach(i => { if (!had.has(i.id)) enterIds.add(i.id); });
    commit();
  }

  function commit() { save(); render(); }

  // ---------- motion ----------
  const REDUCE = matchMedia('(prefers-reduced-motion: reduce)');
  const EASE_OUT = 'cubic-bezier(0.23, 1, 0.32, 1)';
  const EASE_IN_OUT = 'cubic-bezier(0.77, 0, 0.175, 1)';
  const enterIds = new Set();        // items that should animate in on the next render
  let justToggled = null;            // item whose tick should play its little animation
  const settling = new Map();        // id -> done-state used for sorting while the tick plays
  let settleTimer = null;
  let busy = false;                  // an exit animation is running
  let prevCounts = null, prevLeft = null;

  // FLIP: remember where things were, render, then glide them from old to new place.
  function measure() {
    const m = new Map();
    document.querySelectorAll('[data-flip]').forEach(n => m.set(n.dataset.flip, n.getBoundingClientRect().top));
    return m;
  }
  function flip(prev) {
    if (REDUCE.matches || !prev.size) return;
    const glide = (node, dy) => {
      if (Math.abs(dy) < 1) return;
      node.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 300, easing: EASE_IN_OUT });
    };
    const groupDy = new Map();
    document.querySelectorAll('.group[data-flip]').forEach(g => {
      if (!prev.has(g.dataset.flip)) return;
      const dy = prev.get(g.dataset.flip) - g.getBoundingClientRect().top;
      groupDy.set(g, dy);
      glide(g, dy);
    });
    document.querySelectorAll('.item[data-flip]').forEach(n => {
      if (!prev.has(n.dataset.flip)) return;
      // subtract the parent's own glide so the item doesn't move twice
      glide(n, prev.get(n.dataset.flip) - n.getBoundingClientRect().top - (groupDy.get(n.closest('.group')) || 0));
    });
  }

  function animateOut(nodes, { stagger = 0, x = 0 } = {}) {
    if (!nodes.length) return Promise.resolve();
    busy = true;
    return Promise.all(nodes.map((n, i) => {
      n.style.pointerEvents = 'none';
      return n.animate(
        [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: REDUCE.matches ? 'none' : `translateX(${x}px) scale(0.98)` }],
        { duration: 170, delay: Math.min(i * stagger, 240), easing: EASE_OUT, fill: 'forwards' }
      ).finished;
    })).catch(() => {}).finally(() => { busy = false; });
  }

  function confetti(origin) {
    if (REDUCE.matches || !origin) return;
    const r = origin.getBoundingClientRect();
    const x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
    const colors = ['#161616', '#b8c6f3', '#f7df98', '#b5e2ea', '#f4a28c', '#ffffff'];
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('span');
      p.className = 'confetti';
      p.style.left = x0 + 'px';
      p.style.top = y0 + 'px';
      p.style.background = colors[i % colors.length];
      document.body.append(p);
      const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4;   // upward cone
      const v = 90 + Math.random() * 150;
      const dx = Math.cos(a) * v, dy = Math.sin(a) * v;
      const spin = (Math.random() - 0.5) * 900;
      p.animate([
        { transform: 'translate(0,0) rotate(0deg) scale(0.6)', opacity: 1 },
        { transform: `translate(${dx}px, ${dy}px) rotate(${spin / 2}deg) scale(1)`, opacity: 1, offset: 0.4 },
        { transform: `translate(${dx * 1.4}px, ${dy + 260}px) rotate(${spin}deg) scale(0.9)`, opacity: 0 }
      ], { duration: 1000 + Math.random() * 500, easing: 'cubic-bezier(0.2, 0.6, 0.4, 1)' })
        .finished.then(() => p.remove(), () => p.remove());
    }
  }

  // ---------- toast ----------
  let toastTimer = null, undoFn = null;
  const hideToast = () => { $('#toast').classList.remove('show'); undoFn = null; };
  const armToast = ms => { clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, ms); };
  function toast(msg, onUndo) {
    const t = $('#toast'), m = $('#toastMsg');
    const wasShown = t.classList.contains('show');
    m.textContent = msg;
    // a new message replacing an old one: soft blur-crossfade instead of a hard swap
    if (wasShown && !REDUCE.matches) {
      m.animate([{ opacity: 0, filter: 'blur(3px)' }, { opacity: 1, filter: 'blur(0)' }], { duration: 200, easing: EASE_OUT });
    }
    undoFn = onUndo || null;
    $('#toastUndo').hidden = !onUndo;
    t.classList.add('show');
    armToast(5000);
  }
  // don't let the toast vanish while you're reaching for Undo, or while the tab is hidden
  $('#toast').addEventListener('pointerenter', () => clearTimeout(toastTimer));
  $('#toast').addEventListener('pointerleave', () => { if (undoFn) armToast(2500); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) clearTimeout(toastTimer);
    else if ($('#toast').classList.contains('show')) armToast(2500);
  });

  // ---------- render ----------
  function el(tag, props = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else if (k === 'dataset') Object.assign(n.dataset, v);
      else n.setAttribute(k, v);
    }
    for (const kid of kids) if (kid != null) n.append(kid);
    return n;
  }

  let editingSugg = false;

  function render() {
    const prev = measure();
    const first = prevCounts === null;          // very first paint: gentle staggered entrance
    const list = $('#list');
    list.textContent = '';
    const items = state.items;
    const left = items.filter(i => !i.done).length;
    const done = items.length - left;

    const prog = $('#progress');
    const progText = items.length ? (left ? `${left} of ${items.length} left` : 'All done ✓') : 'Welcome back';
    if (prog.textContent !== progText) {
      prog.textContent = progText;
      if (!first && left !== prevLeft) { prog.classList.remove('bump'); void prog.offsetWidth; prog.classList.add('bump'); }
    }
    renderHero(items, left, done, first);

    if (!items.length) {
      list.append(el('div', { class: 'empty' + (prev.size ? ' enter' : '') },
        el('b', { text: '🧺' }),
        el('p', {}, 'Nothing here yet. ',
          el('span', { text: 'Type products below and they will be sorted into shop aisles for you. Tap a product\'s icon to move it to another aisle.' }))));
    }

    const counts = new Map();
    let k = 0;                                   // stagger index for entering things
    const sortDone = i => settling.has(i.id) ? settling.get(i.id) : i.done;
    for (const c of CATS) {
      const inCat = items.filter(i => (CAT_BY_ID[i.cat] ? i.cat : 'other') === c.id);
      if (!inCat.length) continue;
      inCat.sort((a, b) => (sortDone(a) - sortDone(b)) || (a.added - b.added));
      const open = inCat.filter(i => !i.done).length;
      counts.set(c.id, open);
      const groupIsNew = !prev.has('g-' + c.id);
      const ul = el('ul');
      let groupDelay = null;
      for (const it of inCat) {
        const li = renderItem(it);
        if (first || enterIds.has(it.id)) {
          const d = Math.min(k++ * 35, 280);
          if (groupDelay === null) groupDelay = d;
          if (!groupIsNew) { li.classList.add('enter'); li.style.setProperty('--d', d + 'ms'); }
        }
        ul.append(li);
      }
      const was = prevCounts && prevCounts.get(c.id);
      const n = el('span', { class: 'n', text: open ? String(open) : '✓' });
      if (was !== undefined && was !== null && was !== open && open) n.classList.add('bump');
      const sec = el('section', {
        class: 'group' + (open ? '' : ' complete') + (!open && was ? ' just-complete' : ''),
        dataset: { cat: c.id, flip: 'g-' + c.id }
      }, el('h2', {},
        el('span', { class: 'gicon', 'aria-hidden': 'true', style: `--tint:${TINT[c.id]}`, text: c.icon }),
        el('span', { class: 'gname', text: c.name }), n), ul);
      if (groupIsNew) { sec.classList.add('enter'); sec.style.setProperty('--d', (groupDelay || 0) + 'ms'); }
      list.append(sec);
    }
    prevCounts = counts;
    prevLeft = left;
    enterIds.clear();
    justToggled = null;

    const cd = $('#clearDone');
    cd.getAnimations().forEach(a => a.cancel());   // it survives renders, so drop any exit animation
    cd.style.pointerEvents = '';
    const cdWasHidden = cd.hidden;
    cd.hidden = !done;
    cd.textContent = `Remove ${done} ticked item${done === 1 ? '' : 's'}`;
    cd.classList.toggle('enter', cdWasHidden && !cd.hidden);

    renderSuggestions();
    flip(prev);

    if (flashId) {
      const n = list.querySelector(`[data-id="${flashId}"]`);
      if (n) { n.classList.add('flash'); n.scrollIntoView({ block: 'nearest', behavior: REDUCE.matches ? 'auto' : 'smooth' }); }
      flashId = null;
    }
  }

  // Pastel tint behind each aisle's icon
  const TINT = {
    produce: '#d3ecc9', bakery: '#f6e1b8', dairy: '#f7efb5', meat: '#f6cdc4', frozen: '#cde8f3', pantry: '#ecdcc8',
    snacks: '#eed3ec', drinks: '#cfdbf7', household: '#d6eedf', care: '#f4d6e1', other: '#e6e6ea'
  };
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  let shownPct = 0, pctRaf = 0;

  function renderHero(items, left, done, first) {
    $('#today').textContent = 'Today, ' + new Date().toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

    // Headline: light text with bold highlights
    const h = $('#headline');
    const openAisles = new Set(items.filter(i => !i.done).map(i => i.cat)).size;
    const parts = !items.length ? ['Hello! Your list is ', ['empty.'], ' What do we need?']
      : left ? ['You have ', [plural(left, 'product', 'products')], ' to buy in ', [plural(openAisles, 'aisle', 'aisles')], ' today.']
      : ['Everything is ', ['in the basket.'], ' Nice work!'];
    const sig = JSON.stringify(parts);
    if (h.dataset.sig !== sig) {
      h.textContent = '';
      for (const p of parts) h.append(Array.isArray(p) ? el('b', { text: p[0] }) : p);
      if (h.dataset.sig && !first) { h.classList.remove('swap'); void h.offsetWidth; h.classList.add('swap'); }
      h.dataset.sig = sig;
    }

    // Pills
    const pills = $('#pills');
    pills.textContent = '';
    if (items.length) {
      pills.append(el('span', { class: 'pill' }, el('span', { text: '🧺' }),
        el('span', {}, 'In basket: ', el('b', { text: String(done) }), el('span', { class: 'dim', text: '/' + items.length }))));
      const sizes = {};
      items.filter(i => !i.done).forEach(i => sizes[i.cat] = (sizes[i.cat] || 0) + 1);
      const top = Object.entries(sizes).sort((a, b) => b[1] - a[1])[0];
      if (top) {
        const c = CAT_BY_ID[top[0]] || CAT_BY_ID.other;
        pills.append(el('span', { class: 'pill' }, el('span', { text: c.icon }),
          el('span', {}, 'Most in ', el('b', { text: c.name }))));
      }
    }

    // Progress card
    const pc = $('#progressCard');
    pc.hidden = !items.length;
    const pct = items.length ? Math.round(done / items.length * 100) : 0;
    $('#mood').textContent = pct === 100 ? 'All done, well shopped 🎉' : pct >= 50 ? 'You are doing great 😇'
      : pct > 0 ? 'Good start, keep going 🙂' : 'Ready when you are 🛒';
    $('#barFill').style.transform = `scaleX(${pct / 100})`;
    countTo(pct, first || pc.hidden);
  }

  // The big % number counts up/down instead of jumping
  function countTo(target, instant) {
    cancelAnimationFrame(pctRaf);
    const node = $('#pct');
    if (instant || REDUCE.matches || shownPct === target) { shownPct = target; node.textContent = target; return; }
    const from = shownPct, t0 = performance.now(), dur = 420;
    const step = now => {
      const t = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - t, 3);
      shownPct = Math.round(from + (target - from) * e);
      node.textContent = shownPct;
      if (t < 1) pctRaf = requestAnimationFrame(step);
    };
    pctRaf = requestAnimationFrame(step);
  }

  function toggle(it) {
    if (!settling.has(it.id)) settling.set(it.id, it.done);   // hold its place while the tick plays
    it.done = !it.done;
    justToggled = it.id;
    clearTimeout(settleTimer);
    settleTimer = setTimeout(() => { settling.clear(); render(); }, 650);
    commit();
    if (it.done && state.items.every(i => i.done)) {
      confetti(document.querySelector(`[data-id="${it.id}"] .box`));
    }
  }

  function removeItem(it, li) {
    if (busy) return;
    animateOut([li], { x: 28 }).then(() => {
      const snap = snapshot();
      state.items = state.items.filter(x => x.id !== it.id);
      commit();
      toast(`Removed ${it.name}`, () => restore(snap));
    });
  }

  function renderItem(it) {
    const sel = el('select', { 'aria-label': `Group for ${it.name}`, title: 'Move to another group' });
    for (const c of CATS) {
      const o = el('option', { value: c.id, text: `${c.icon}  ${c.name}` });
      if (c.id === it.cat) o.selected = true;
      sel.append(o);
    }
    sel.addEventListener('change', () => {
      it.cat = sel.value;
      state.learned[keyOf(it.name)] = sel.value; // remember for next time
      flashId = it.id;
      commit();
    });

    const box = el('span', { class: 'box', 'aria-hidden': 'true' });
    box.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5.5 12.5l4.2 4.2L18.5 7.8" pathLength="1"/></svg>';
    const anim = justToggled === it.id ? (it.done ? ' just-ticked' : ' just-unticked') : '';
    const li = el('li', { class: 'item' + (it.done ? ' done' : '') + anim, dataset: { id: it.id, flip: 'i-' + it.id } },
      el('button', { class: 'tick', type: 'button', 'aria-pressed': String(it.done),
        onclick: () => toggle(it) },
        box,
        el('span', { class: 'txt' },
          el('span', { class: 'name', text: it.name }),
          it.qty ? el('span', { class: 'qty', text: /^\d+([.,]\d+)?$/.test(it.qty) ? '× ' + it.qty : it.qty }) : null)),
      el('span', { class: 'catpick' },
        el('span', { 'aria-hidden': 'true', text: (CAT_BY_ID[it.cat] || CAT_BY_ID.other).icon }), sel),
      el('button', { class: 'del', type: 'button', 'aria-label': `Remove ${it.name}`, title: 'Remove',
        onclick: () => removeItem(it, li) }));
    li.lastChild.innerHTML = '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>';
    return li;
  }

  function renderSuggestions() {
    const box = $('#suggBox'), chips = $('#chips');
    chips.textContent = '';
    box.classList.toggle('editing', editingSugg);
    $('#suggEdit').textContent = editingSugg ? 'Done' : 'Edit';

    const typed = $('#entry').value.split(/[;,\n]/).pop();
    const q = keyOf(parseEntry(typed).name || '');
    const inList = new Set(state.items.map(i => keyOf(i.name)));

    let list = Object.entries(state.history).filter(([k]) => !inList.has(k));
    if (q && !editingSugg) {
      list = list.filter(([k]) => k.includes(q))
        .sort(([ka, a], [kb, b]) => (kb.startsWith(q) - ka.startsWith(q)) || (b.count - a.count) || (b.last - a.last));
      $('#suggTitle').textContent = 'Matching';
    } else {
      list.sort(([, a], [, b]) => (b.count - a.count) || (b.last - a.last));
      $('#suggTitle').textContent = editingSugg ? 'Tap to forget' : 'Often bought';
    }
    if (!editingSugg) list = list.slice(0, 16);

    box.hidden = !list.length && !editingSugg;
    if (editingSugg && !Object.keys(state.history).length) { editingSugg = false; box.hidden = true; }

    for (const [k, h] of list) {
      const icon = CAT_BY_ID[state.learned[k] || guessCategory(h.label)].icon;
      chips.append(el('button', { class: 'chip', type: 'button', title: `Bought ${h.count}×`,
        onclick: e => {
          if (editingSugg) {
            if (busy) return;
            animateOut([e.currentTarget]).then(() => { delete state.history[k]; commit(); });
            return;
          }
          addOne({ name: h.label, qty: '' });
          // clear just the partially typed product
          const v = $('#entry').value;
          const cut = Math.max(v.lastIndexOf(','), v.lastIndexOf(';'));
          $('#entry').value = cut >= 0 ? v.slice(0, cut + 1) + ' ' : '';
          if (!$('#entry').value.trim().replace(/[,;]$/, '')) $('#entry').value = '';
          syncAddBtn();
          commit();
        } },
        el('span', { 'aria-hidden': 'true', text: icon }),
        el('span', { text: h.label }),
        el('span', { class: 'x', 'aria-hidden': 'true', text: '×' })));
    }
  }

  // ---------- wiring ----------
  $('#addForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#entry').value;
    if (!v.trim()) return;
    $('#entry').value = '';
    addRaw(v);
    syncAddBtn();
    $('#entry').focus();
  });
  const syncAddBtn = () => $('#addBtn').classList.toggle('idle', !$('#entry').value.trim());
  $('#entry').addEventListener('input', () => { syncAddBtn(); renderSuggestions(); });
  $('#suggEdit').addEventListener('click', () => { editingSugg = !editingSugg; renderSuggestions(); });

  function clearDone() {
    if (busy || !state.items.some(i => i.done)) return;
    const nodes = [...document.querySelectorAll('.item.done')];
    if (!$('#clearDone').hidden) nodes.push($('#clearDone'));
    animateOut(nodes, { stagger: 30, x: 28 }).then(() => {
      const n = state.items.filter(i => i.done).length;
      if (!n) return render();
      const snap = snapshot();
      state.items = state.items.filter(i => !i.done);
      commit();
      $('#clearDone').style.pointerEvents = '';
      toast(`Removed ${n} ticked item${n === 1 ? '' : 's'}`, () => restore(snap));
    });
  }
  $('#clearDone').addEventListener('click', clearDone);

  const closeMenu = () => $('#menu').removeAttribute('open');
  $('#mClearDone').addEventListener('click', () => { closeMenu(); clearDone(); });
  $('#mUntick').addEventListener('click', () => {
    closeMenu();
    const snap = snapshot();
    state.items.forEach(i => i.done = false);
    commit();
    toast('Unticked everything', () => restore(snap));
  });
  $('#mClearAll').addEventListener('click', () => {
    closeMenu();
    if (busy || !state.items.length) return;
    animateOut([...document.querySelectorAll('.group, #clearDone:not([hidden])')], { stagger: 25 }).then(() => {
      const snap = snapshot();
      state.items = [];
      commit();
      $('#clearDone').style.pointerEvents = '';
      toast('List cleared', () => restore(snap));
    });
  });
  $('#mForget').addEventListener('click', () => {
    closeMenu();
    if (!confirm('Forget all suggestions and learned groups? Your current list stays.')) return;
    state.history = {};
    state.learned = {};
    commit();
  });
  document.addEventListener('click', e => { if (!$('#menu').contains(e.target)) closeMenu(); });

  $('#toastUndo').addEventListener('click', () => {
    const fn = undoFn; undoFn = null;
    $('#toast').classList.remove('show');
    if (fn) fn();
  });

  // Keep several open tabs in sync.
  window.addEventListener('storage', e => { if (e.key === STORE_KEY) { load(); render(); } });

  // Keep the list and toast clear of the bottom dock, whatever its height
  const syncDock = () => document.documentElement.style.setProperty('--dock-h', $('#dock').offsetHeight + 'px');
  new ResizeObserver(syncDock).observe($('#dock'));
  syncDock();

  load();
  save();
  render();
})();
</script>
</body>
</html>
